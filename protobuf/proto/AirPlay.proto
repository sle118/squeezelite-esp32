syntax = "proto3";
import "nanopb.proto";
import "customoptions.proto";
package sys.airplay;
message config {
    option (nanopb_msgopt).packed_struct  = true;
    option (nanopb_msgopt).msgid  = 1001;
    bool enabled = 1 [(cust_field).v_bool = true];
    uint32 port = 2 [(nanopb).int_size = IS_8];
    

}